services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kutuphane_db}
      POSTGRES_USER: ${POSTGRES_USER:-kutuphane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kutuphane}
      # Türkçe sıralama (Ç, Ğ, İ, Ö, Ş, Ü doğru yerde) — yalnızca ilk oluşturulurken uygulanır
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=tr-TR --locale=C.UTF-8"
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kutuphane}:${POSTGRES_PASSWORD:-kutuphane}@db:5432/${POSTGRES_DB:-kutuphane_db}
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      RUN_DAILY_JOBS: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
